# Metria CI：质量门禁 + 前端构建 + 多架构容器镜像
#
# 触发：push 到 main、pull request。
# main 分支会构建并推送 amd64/arm64 镜像到 ghcr.io/supercxyz/metria:main 与 :<sha>。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/supercxyz/metria

jobs:
  rust:
    name: Rust 质量门禁（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # rust-embed 需要 web/dist 存在，先构建前端
      - name: 构建前端（供 rust-embed 使用）
        run: |
          cd web
          npm ci
          npm run build

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  web:
    name: Web 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: cd web && npm ci

      - name: typecheck
        run: cd web && npm run typecheck

      - name: build
        run: cd web && npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: metria-web-dist
          path: web/dist

  docker:
    name: Docker 多架构镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        run: |
          SHA_SHORT=${GITHUB_SHA::8}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.IMAGE }}:main,${{ env.IMAGE }}:$SHA_SHORT" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
