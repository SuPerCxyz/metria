# Metria Release：打 tag（v*）时构建发布产物
#
# - 执行完整质量门禁并校验 tag 与 workspace 版本
# - 编译 linux/amd64、linux/arm64 与 Windows amd64 二进制并生成 SHA256SUMS
# - 构建并推送多架构镜像到 ghcr.io/supercxyz/metria:<tag>、:latest 与 :master
# - 生成 SBOM（buildx provenance）

name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/supercxyz/metria

jobs:
  release:
    name: Release 构建与发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 校验发布版本
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "metria-cli"))')"
          if [ "$tag_version" != "$workspace_version" ]; then
            echo "tag v$tag_version 与 workspace 版本 $workspace_version 不一致" >&2
            exit 1
          fi

      - name: 构建并测试前端
        run: cd web && npm ci && npm audit --audit-level=high && npm test && npm run build

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: 创建发布目录
        run: mkdir -p dist

      # ---- amd64 二进制 ----
      - name: 构建 linux/amd64 发布二进制
        run: cargo build --release --workspace --bin metria

      - name: 上传 amd64 二进制
        uses: actions/upload-artifact@v6
        with:
          name: metria-linux-amd64
          path: target/release/metria
          if-no-files-found: error

      - name: 准备 amd64 发布文件
        run: install -m 0755 target/release/metria dist/metria-linux-amd64

      # ---- arm64 二进制（交叉编译） ----
      - name: 安装 arm64 交叉编译链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: 构建 linux/arm64 发布二进制
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          rustup target add aarch64-unknown-linux-gnu
          cargo build --release --workspace --bin metria --target aarch64-unknown-linux-gnu

      - name: 上传 arm64 二进制
        uses: actions/upload-artifact@v6
        with:
          name: metria-linux-arm64
          path: target/aarch64-unknown-linux-gnu/release/metria
          if-no-files-found: error

      - name: 准备 arm64 发布文件
        run: |
          install -m 0755 target/aarch64-unknown-linux-gnu/release/metria dist/metria-linux-arm64

      # ---- Windows amd64 二进制（交叉编译） ----
      - name: 安装 Windows 交叉编译链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: 构建 Windows amd64 发布二进制
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo build --release --workspace --bin metria --target x86_64-pc-windows-gnu

      - name: 上传 Windows amd64 二进制
        uses: actions/upload-artifact@v6
        with:
          name: metria-windows-amd64
          path: target/x86_64-pc-windows-gnu/release/metria.exe
          if-no-files-found: error

      - name: 准备 Windows 发布文件并生成校验和
        run: |
          install -m 0755 target/x86_64-pc-windows-gnu/release/metria.exe dist/metria-windows-amd64.exe
          sha256sum dist/metria-linux-amd64 dist/metria-linux-arm64 dist/metria-windows-amd64.exe > dist/SHA256SUMS

      - name: 上传校验和
        uses: actions/upload-artifact@v6
        with:
          name: metria-sha256sums
          path: dist/SHA256SUMS
          if-no-files-found: error

      # ---- 多架构镜像 + SBOM ----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送多架构镜像（含 SBOM/provenance）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:master
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 将二进制附到 GitHub Release ----
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/metria-linux-amd64
            dist/metria-linux-arm64
            dist/metria-windows-amd64.exe
            dist/SHA256SUMS
          generate_release_notes: true
