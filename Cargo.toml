[workspace]
resolver = "2"
members = [
    "crates/metria-core",
    "crates/metria-protocol",
    "crates/metria-storage",
    "crates/metria-pricing",
    "crates/metria-traffic",
    "crates/metria-adapter-api",
    "crates/metria-adapter-claude",
    "crates/metria-adapter-codex",
    "crates/metria-adapter-opencode",
    "crates/metria-agent",
    "crates/metria-hub",
    "crates/metria-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
homepage = "https://github.com/metria/metria"
repository = "https://github.com/metria/metria"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
