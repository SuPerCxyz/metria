[package]
name = "metria-adapter-claude"
description = "Claude Code JSONL Adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
metria-core = { path = "../metria-core" }
metria-adapter-api = { path = "../metria-adapter-api" }
metria-traffic = { path = "../metria-traffic" }

[dev-dependencies]
metria-adapter-api = { path = "../metria-adapter-api", features = [] }
