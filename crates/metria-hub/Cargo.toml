[package]
name = "metria-hub"
description = "Metria Hub：Ingest、Query、SSE、认证与 Web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8"
async-stream = "0.3"
zstd = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rust-embed = { version = "8", features = ["debug-embed"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono-tz = { version = "0.10" }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
base64 = "0.22"
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "area_series", "ab_glyph"] }
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }
image = { version = "0.24", default-features = false, features = ["png"] }
metria-core = { path = "../metria-core" }
metria-pricing = { path = "../metria-pricing" }
metria-traffic = { path = "../metria-traffic" }
metria-protocol = { path = "../metria-protocol" }
metria-storage = { path = "../metria-storage" }

[dev-dependencies]
metria-agent = { path = "../metria-agent" }
metria-adapter-api = { path = "../metria-adapter-api" }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
tempfile = "3"
serde_json = "1" 
